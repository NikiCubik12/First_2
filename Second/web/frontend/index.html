<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; }
        h1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px 32px; text-align: center; font-size: 28px; }
        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #e9ecef; padding: 0 16px; gap: 4px; }
        .tab-btn { flex: 1; padding: 16px 24px; font-size: 16px; font-weight: 600; background: transparent; border: none; cursor: pointer; transition: all 0.3s; color: #6c757d; border-radius: 12px 12px 0 0; }
        .tab-btn:hover { background: #e9ecef; color: #667eea; }
        .tab-btn.active { background: white; color: #667eea; border-bottom: 3px solid #667eea; }
        .tab-content { padding: 32px; }
        #message-area { margin: 20px 32px 32px 32px; padding: 14px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
        .error-message { background: #fee; border-left: 4px solid #dc3545; }
        .success-message { background: #e8f4e8; border-left: 4px solid #28a745; }
        #message-text { font-size: 14px; color: #333; }
        #message-area button { background: none; border: none; font-size: 20px; cursor: pointer; color: #adb5bd; padding: 0 8px; }
        #message-area button:hover { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Лабораторная работа </h1>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="dynamic" hx-get="/panel/dynamic" hx-target="#tab-content" hx-swap="innerHTML" hx-trigger="click" _="on click remove .active from .tab-btn then add .active to me">📦 Динамический массив</button>
            <button class="tab-btn" data-tab="linked" hx-get="/panel/linked" hx-target="#tab-content" hx-swap="innerHTML" hx-trigger="click" _="on click remove .active from .tab-btn then add .active to me">🔗 Связный список</button>
            <button class="tab-btn" data-tab="sequence" hx-get="/panel/sequence" hx-target="#tab-content" hx-swap="innerHTML" hx-trigger="click" _="on click remove .active from .tab-btn then add .active to me">📜 Последовательности</button>
        </div>
        
        <div id="tab-content" class="tab-content">
            <!-- Загружается через HTMX -->
        </div>
        
        <div id="message-area">
            <span id="message-text">✅ Готов к работе</span>
            <button onclick="document.getElementById('message-text').innerHTML='✅ Готов к работе'; document.getElementById('message-area').classList.remove('error-message', 'success-message');">✖</button>
        </div>
    </div>
    
    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'tab-content') {
                // При загрузке новой вкладки
                const msgArea = document.getElementById('message-area');
                msgArea.classList.remove('error-message', 'success-message');
                document.getElementById('message-text').innerHTML = '✅ Готов к работе';
            }
        });
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // Загружаем первую вкладку
        fetch('/panel/dynamic').then(r => r.text()).then(html => {
            document.getElementById('tab-content').innerHTML = html;
        });
    </script>
</body>
</html>
